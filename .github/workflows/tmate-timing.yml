name: tmate-timing
on:
  push:
    branches:
      - tmate-timing
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo ok
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ always() }}
        timeout-minutes: 2
        continue-on-error: true
        with:
          detached: true

name: tmate-timing
on:
  push:
    branches:
      - tmate-timing
jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        run: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - run: exit 1
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() }}
        timeout-minutes: 20
        with:
          detached: true
